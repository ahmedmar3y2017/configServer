server:
  port: 9095
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: room-reservation-service
          uri: lb://room-reservation-service
          predicates:
            - Path=/roomReservations/**
          filters:
            - name: Logging
              args:
                tag: room-reservation-service
                
        - id: config-server
          uri: lb://config-server
          predicates:
            - Path=/config-server/**
          filters:
            - name: StripPrefix
              args:
                parts: 1

        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/auth/**

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    # A base64-encoded 256-bit secret (generate one and paste)
    secret: "bXlfc2VjcmV0X2tleV90aGF0X2lzX2xvbmdlX2Vub3VnaA=="
    expiration-ms: 3600000